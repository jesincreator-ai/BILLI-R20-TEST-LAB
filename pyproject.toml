[project]
name = "billi-r20-ai-lab"
version = "1.0.0"
description = "BILLI R-20 modular AI test laboratory"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"