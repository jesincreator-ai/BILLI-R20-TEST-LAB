[project]
name = "billi-r20-ai-lab"
version = "1.1.0"
description = "BILLI R-20 modular AI test laboratory with private Drive RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "google-auth>=2.30,<3.0",
  "google-api-python-client>=2.130,<3.0",
  "google-genai>=1.0,<2.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
addopts = "-q"
