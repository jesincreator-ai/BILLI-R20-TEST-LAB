name: Build public knowledge index

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/public/**'
      - 'scripts/build_knowledge_index.py'
      - '.github/workflows/knowledge-index.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index
        run: python scripts/build_knowledge_index.py
      - name: Commit index if changed
        run: |
          if git diff --quiet; then
            echo "Index unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/public/index.json
          git commit -m "Build public knowledge index"
          git push
